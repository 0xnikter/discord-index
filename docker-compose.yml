services:
  discord-index:
    build: .
    image: discord-index:latest
    restart: unless-stopped
    env_file: .env
    environment:
      HTTP_HOST: 0.0.0.0
      DB_PATH: /app/data/index.db
      POLICY_FILE: /app/policy.yaml
    volumes:
      - index-data:/app/data
      - ./policy.yaml:/app/policy.yaml:ro
    expose:
      - "8087"

  # Periodic sync. Same image, different command; shares the index volume.
  sync:
    build: .
    image: discord-index:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/index.db
      POLICY_FILE: /app/policy.yaml
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-300}"
    volumes:
      - index-data:/app/data
      - ./policy.yaml:/app/policy.yaml:ro
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do node dist/cli.js sync || echo "sync failed, retrying next cycle"; sleep "$$SYNC_INTERVAL_SECONDS"; done'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - discord-index

volumes:
  index-data:
  caddy-data:
  caddy-config:
