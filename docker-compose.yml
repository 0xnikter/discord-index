services:
  discord-index:
    build: .
    image: discord-index:latest
    restart: unless-stopped
    env_file: .env
    environment:
      HTTP_HOST: 0.0.0.0
      DB_PATH: /app/data/index.db
      POLICY_FILE: /app/policy.yaml
      # Caddy is the only route to this container, so the forwarded header is trustworthy here.
      TRUST_PROXY: "true"
    volumes:
      - index-data:/app/data
      # Absolute path when the deployment keeps policy outside the source tree, so a code
      # update cannot overwrite it. Defaults to the repo copy for local use.
      - ${POLICY_HOST_PATH:-./policy.yaml}:/app/policy.yaml:ro
    expose:
      - "8087"

  # Periodic sync. Same image, different command; shares the index volume.
  sync:
    build: .
    image: discord-index:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/index.db
      POLICY_FILE: /app/policy.yaml
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-300}"
    volumes:
      - index-data:/app/data
      # Absolute path when the deployment keeps policy outside the source tree, so a code
      # update cannot overwrite it. Defaults to the repo copy for local use.
      - ${POLICY_HOST_PATH:-./policy.yaml}:/app/policy.yaml:ro
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        fails=0
        while true; do
          if node dist/cli.js sync; then
            fails=0
          else
            fails=$$((fails + 1))
            # Loud and escalating: a silently retrying sync leaves the index frozen with no signal.
            echo "SYNC FAILED ($$fails consecutive). The index is now stale; check sync_status." >&2
            if [ "$$fails" -ge 3 ]; then sleep $$((SYNC_INTERVAL_SECONDS * 2)); fi
          fi
          sleep "$$SYNC_INTERVAL_SECONDS"
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - discord-index

volumes:
  index-data:
  caddy-data:
  caddy-config:
